name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python backend/app.py --init-only
      - run: npm run check
      - run: python tests/test_backend.py
      - run: python tests/test_convenience.py
      - run: npm run test:browser
      - run: python build_release.py
      - id: version
        shell: pwsh
        run: |
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Lecture-Notes-v${{ steps.version.outputs.version }}
          path: dist/Lecture-Notes-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
